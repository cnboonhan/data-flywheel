env_name: franka_mug_to_bowl_maple_table
embodiment:
  id: franka
  registry_name: franka_ik
  params: {}
background:
  id: maple_table
  registry_name: maple_table_robolab
  params: {}
objects:
- id: mug
  registry_name: mug
  params: {}
- id: bowl
  registry_name: bowl_ycb_robolab
  params: {}
relations:
- kind: is_anchor
  subject: maple_table
  params: {}
- kind: 'on'
  subject: mug
  reference: maple_table
  params: {}
- kind: 'on'
  subject: bowl
  reference: maple_table
  params: {}
task:
  composition: atomic
  description: Franka robot picks up a mug from the maple table and places it in a
    bowl.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: mug
      destination_location: bowl
      background_scene: maple_table
