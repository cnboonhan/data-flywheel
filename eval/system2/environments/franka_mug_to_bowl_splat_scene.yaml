env_name: franka_mug_to_bowl_splat_scene
# Needs ARENA_SPLAT_SCENE=<sim/colmap_splat run>/scene.usda (trained with --floor); see sim/isaaclab_arena/README.md.
embodiment:
  id: franka
  registry_name: franka_ik
  params: {}
background:
  id: splat
  registry_name: splat_scene
  params: {}
objects:
- id: table
  registry_name: office_table
  params: {}
- id: mug
  registry_name: mug
  params: {}
- id: bowl
  registry_name: bowl_ycb_robolab
  params: {}
object_references:
- id: floor
  parent_id: splat
  prim_path: floor
  object_type: base
  params: {}
relations:
- kind: is_anchor
  subject: floor
  params: {}
- kind: 'on'
  subject: table
  reference: floor
  params: {}
- kind: at_position          # office_table is 1.8 m long: near edge 0.25 m in front of the robot
  subject: table
  params:
    x: 1.15
    y: 0.0
- kind: 'on'
  subject: mug
  reference: table
  params: {}
- kind: 'on'
  subject: bowl
  reference: table
  params: {}
- kind: position_limits_box  # keep the objects on the table's near half, within the arm's reach
  subject: mug
  params: {x_min: 0.35, x_max: 0.65, y_min: -0.3, y_max: 0.3}
- kind: position_limits_box
  subject: bowl
  params: {x_min: 0.35, x_max: 0.65, y_min: -0.3, y_max: 0.3}
task:
  composition: atomic
  description: Franka robot picks up a mug from a table in a captured warehouse and places it in a bowl.
  subtasks:
  - kind: PickAndPlaceTask
    params:
      pick_up_object: mug
      destination_location: bowl
      background_scene: splat
