# ROS 2 side of the world-generation loop. Isaac Sim runs on the host with its bundled ROS 2 Jazzy;
# this container shares the host network so DDS discovery just works (UDP-only profile, see ros/fastdds.xml).
#   docker compose -f sim/worldgen/compose.yml run --rm nav                       # shell with ROS sourced
#   docker compose -f sim/worldgen/compose.yml run --rm nav ros2 topic list
#   docker compose -f sim/worldgen/compose.yml up explore                         # SLAM + Nav2 + frontier exploration
#   docker compose -f sim/worldgen/compose.yml run --rm nav /worldgen/record.sh <name>   # record the capture bag
x-nav: &nav
  build: ./docker
  image: flywheel-worldgen-nav
  network_mode: host
  ipc: host
  user: "${UID:-1000}:${GID:-1000}"   # files under runs/ stay owned by you; HOME below keeps ROS logs writable
  environment:
    HOME: /tmp
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}   # same as isaac.sh; keeps the sim off the robot's domain 0
    RMW_IMPLEMENTATION: rmw_fastrtps_cpp
    FASTRTPS_DEFAULT_PROFILES_FILE: /worldgen/fastdds.xml
  volumes:
    - ./ros:/worldgen:ro
    - ./runs:/runs

services:
  nav:
    <<: *nav
    stdin_open: true
    tty: true
  explore:
    <<: *nav
    command: ros2 launch /worldgen/explore.launch.py
