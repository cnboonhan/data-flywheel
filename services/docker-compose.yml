# Infra stack: Caddy, Versity S3 Gateway, MLflow, Loki, Prometheus (+ Pushgateway), Grafana.
# Every image is a multi-arch manifest (linux/arm64 + linux/amd64), so the same
# file runs on the GB300 node and on an Intel box. See README.md.
# Container ports (7070, 5000, 3000, 4180, 8080, ...) are each app's default or the one it is told here; only Caddy's
# is published, and caddy/Caddyfile proxies to the others by service name and port.

x-common: &common
  restart: unless-stopped
  user: "${SERVICE_UID}:${SERVICE_GID}"
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }   # up to 100 MB of logs per container; untuned

services:
  caddy:
    <<: *common
    image: caddy:2.11
    ports:
      - "${CADDY_PORT:-8443}:8443"   # everything: path-routed on SERVICE_HOST, subdomains for fiftyone., rerun., s3.
    environment:
      SERVICE_HOST: ${SERVICE_HOST}
      CADDY_PORT: ${CADDY_PORT:-8443}
      LOKI_PUSH_TOKEN: ${LOKI_PUSH_TOKEN:-}   # bearer token for POST /loki/api/v1/push from outside
      PUSHGATEWAY_TOKEN: ${PUSHGATEWAY_TOKEN:-}   # bearer token for pushes to /pushgateway/metrics/job/... from outside
      RERUN_RAW_TOKEN: ${RERUN_RAW_TOKEN:-}   # path token for raw bags in Rerun links
      TRITON_ADDR: ${TRITON_ADDR:-}           # TRITON_NODE's address (ctl.sh); Triton runs there (triton/compose.yml)
      TRITON_KEY: ${TRITON_KEY:-}             # the header Triton requires, added on the way through
      LLM_GATEWAY_ADDR: ${LLM_GATEWAY_ADDR:-}   # DYNAMO_HEAD's address (ctl.sh): the LLM gateway behind llm.<host>
      SERVING_NODES: ${TRITON_NODE:-}|${DYNAMO_NODE:-}|${DYNAMO_HEAD:-}|${DYNAMO_WORKER:-}   # their GPUs on the landing page's load table
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/site:/srv:ro
      - ../assets/bufo/all-the-bufo:/srv/bufo:ro   # submodule assets/bufo: the landing page's hover images
      - ../assets:/srv/assets:ro   # the architecture diagram on the landing page; a folder, since git replaces files and a file mount would go stale
      - ../devroles:/srv/devroles:ro   # the role pages the landing page includes on hover; not served by themselves (Caddyfile)
      - ${STATE_DIR}/caddy/data:/data
      - ${STATE_DIR}/caddy/config:/config
      - ${STATE_DIR}/versitygw/buckets/raw:/raw:ro   # raw files Rerun imports by URL, served on rerun.<host>/raw/
    depends_on: [mlflow, grafana, loki, versitygw, gitea, keycloak, oauth2-proxy]

  versitygw:
    <<: *common
    image: versity/versitygw:v1.8.0
    command:
      - --port=:7070
      - --webui-s3-prefix=/ui         # web UI on the S3 port under /ui: https://s3.<host>:8443/ui/
      - --webui-gateways=https://s3.${SERVICE_HOST}:${CADDY_PORT:-8443}
      - --cors-allow-origin=https://${SERVICE_HOST}:${CADDY_PORT:-8443}
      - --iam-dir=/state/iam
      - --health=/health
      - posix
      - --sidecar=/state/meta        # /tier1 (WekaFS) has no xattrs; keep object metadata in a sidecar dir
      - --disable-copy-file-range
      - /state/buckets               # backend flags must precede the directory
    environment:
      ROOT_ACCESS_KEY_ID: ${ADMIN_USER}
      ROOT_SECRET_ACCESS_KEY: ${ADMIN_PASSWORD}
      VGW_REGION: ${S3_REGION:-us-east-1}
      VGW_LOG_LEVEL: ${S3_LOG_LEVEL:-silent}   # "debug" logs every request/response with secrets masked
    volumes:
      - ${STATE_DIR}/versitygw:/state

  mlflow:
    <<: *common
    build: ./mlflow
    image: flywheel-mlflow:3.17.0-oidc
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --app-name=oidc-auth                 # mlflow-oidc-auth: Keycloak login, access tokens, permissions; the /mlflow prefix
                                             # comes from Caddy's X-Forwarded-Prefix (TRUSTED_PROXIES), not --static-prefix
      - --allowed-hosts=${SERVICE_HOST},${SERVICE_HOST}:${CADDY_PORT:-8443},mlflow,mlflow:5000   # mlflow:5000 = Actions jobs on the compose network
      - --cors-allowed-origins=https://${SERVICE_HOST}:${CADDY_PORT:-8443}
      - --backend-store-uri=sqlite:////state/mlflow.db
      - --artifacts-destination=s3://mlflow   # checkpoints and run artifacts live in the S3 gateway
      - --serve-artifacts                     # clients upload through the server; no S3 creds needed
    environment:
      HOME: /state
      # Discovery over the compose network (no TLS): Keycloak advertises the public issuer and
      # authorization URL, and internal token/userinfo/jwks URLs (KC_HOSTNAME_BACKCHANNEL_DYNAMIC).
      OIDC_DISCOVERY_URL: http://keycloak:8080/auth/realms/flywheel/.well-known/openid-configuration
      OIDC_ISSUER: https://${SERVICE_HOST}:${CADDY_PORT:-8443}/auth/realms/flywheel
      OIDC_CLIENT_ID: mlflow
      OIDC_CLIENT_SECRET: ${KC_MLFLOW_SECRET}
      OIDC_AUDIENCE: mlflow
      OIDC_REDIRECT_URI: https://${SERVICE_HOST}:${CADDY_PORT:-8443}/mlflow/callback
      OIDC_PROVIDER_DISPLAY_NAME: Sign in with Keycloak
      OIDC_USERNAME_FIELD: preferred_username   # same usernames as everywhere else (not the email)
      OIDC_GROUPS_ATTRIBUTE: groups
      OIDC_GROUP_NAME: users,admins             # Keycloak groups allowed in
      OIDC_ADMIN_GROUP_NAME: admins
      OIDC_PROVISION_ON_BEARER_AUTH: "true"     # ctl.sh mints access tokens with a Keycloak token
      DEFAULT_MLFLOW_PERMISSION: EDIT           # everyone can log to any experiment; MANAGE stays with owners/admins
      OIDC_USERS_DB_URI: sqlite:////state/oidc_auth.db
      SECRET_KEY: ${MLFLOW_SECRET_KEY}
      SESSION_COOKIE_SECURE: "true"
      TRUSTED_PROXIES: 172.16.0.0/12            # caddy, on the compose network
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_SECRET_KEY}   # signs CSRF tokens
      MLFLOW_S3_ENDPOINT_URL: http://versitygw:7070
      AWS_ACCESS_KEY_ID: ${ADMIN_USER}
      AWS_SECRET_ACCESS_KEY: ${ADMIN_PASSWORD}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ${STATE_DIR}/mlflow:/state

  loki:
    <<: *common
    image: grafana/loki:3.7.8
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - ${STATE_DIR}/loki:/loki
      - ${STATE_DIR}/versitygw/buckets/logging:/logging   # the logging bucket: chunks and index

  # GPU and host metrics of every cluster node (their dcgm-exporter and node_exporter) and Triton's; Grafana queries it.
  prometheus:
    <<: *common
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d   # ~1.9 GB a day uncompacted (36 nodes every 15 s), so ~100-170 GB
      - --storage.tsdb.retention.size=250GB   # cap in case the series grow; the oldest blocks go first
    volumes:
      - ./prometheus:/etc/prometheus:ro   # a folder, so nodes.json and the config follow git's file replacements
      - ${STATE_DIR}/prometheus:/prometheus
      - ${STATE_DIR}/prometheus-sd:/etc/prometheus-sd:ro   # targets ctl.sh writes, e.g. Triton on TRITON_NODE

  # Metrics pushed from outside the stack (Caddy's /pushgateway route, bearer token), e.g. which GPU each Slurm job
  # holds (slurm-exporter/exporter.py --push); Prometheus scrapes it. Pushes are kept in memory: lost on restart until
  # the next push.
  pushgateway:
    <<: *common
    image: prom/pushgateway:v1.11.3

  grafana:
    <<: *common
    image: grafana/grafana:13.2.3
    environment:
      GF_SERVER_ROOT_URL: https://${SERVICE_HOST}:${CADDY_PORT:-8443}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Keycloak login (the local admin stays as a fallback).
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${KC_GRAFANA_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://${SERVICE_HOST}:${CADDY_PORT:-8443}/auth/realms/flywheel/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/auth/realms/flywheel/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/auth/realms/flywheel/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'admins') && 'Admin' || 'Editor'"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      # Match the SSO admin to the built-in Grafana admin by email (ctl.sh sets both to the same address).
      GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ${STATE_DIR}/grafana:/var/lib/grafana
    depends_on: [loki, prometheus]

  gitea:
    <<: *common
    image: gitea/gitea:1.25-rootless
    environment:
      USER: git   # our uid has no passwd entry; Gitea checks the name against RUN_USER (git)
      GITEA__server__ROOT_URL: https://${SERVICE_HOST}:${CADDY_PORT:-8443}/gitea/
      GITEA__server__DOMAIN: ${SERVICE_HOST}
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__USE_SUB_URL_PATH: "true"   # serve under /gitea/ itself; Caddy strips nothing
      GITEA__server__LOCAL_ROOT_URL: http://localhost:3000/gitea/   # what git hooks call back; must carry the sub-path too
      GITEA__server__DISABLE_SSH: "true"      # clone/push over HTTPS
      GITEA__server__OFFLINE_MODE: "true"
      GITEA__server__LFS_START_SERVER: "true"
      GITEA__security__INSTALL_LOCK: "true"   # skip the web installer; everything is configured here
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /var/lib/gitea/data/gitea.db
      GITEA__actions__ENABLED: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__repository__ENABLE_PUSH_CREATE_USER: "true"
      GITEA__webhook__ALLOWED_HOST_LIST: private,loopback
      GITEA__log__MODE: console
      GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__USERNAME: nickname
      GITEA__oauth2_client__ACCOUNT_LINKING: auto
      GITEA__oauth2_client__UPDATE_AVATAR: "false"
      SSL_CERT_FILE: /ca/root.crt   # Caddy's CA, so OIDC discovery over https works
    volumes:
      - ${STATE_DIR}/gitea/data:/var/lib/gitea
      - ${STATE_DIR}/gitea/config:/etc/gitea
      - ${STATE_DIR}/caddy/data/caddy/pki/authorities/local/root.crt:/ca/root.crt:ro
    healthcheck:   # unhealthy after 12 failed checks 10 s apart (~2 min); act_runner waits for healthy. Untuned.
      test: ["CMD", "curl", "-fs", "http://localhost:3000/gitea/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Runs Gitea Actions jobs as sibling containers via the node's Docker socket.
  # ctl.sh registers it: it generates the token with `gitea actions
  # generate-runner-token` and writes it to ${STATE_DIR}/act_runner/token.
  act_runner:
    <<: *common
    image: gitea/act_runner:0.2.13
    group_add:
      - "${DOCKER_GID:-983}"   # gid of /var/run/docker.sock on the node
    environment:
      HOME: /data
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: http://gitea:3000/gitea/
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /data/token
      GITEA_RUNNER_NAME: ${SERVICE_NODE}
      RERUN_BASE: https://rerun.${SERVICE_HOST}:${CADDY_PORT:-8443}
    volumes:
      - ./act_runner/config.yaml:/config.yaml:ro
      - ${STATE_DIR}/act_runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      gitea:
        condition: service_healthy

  mongo:
    <<: *common
    image: mongo:8
    # WiredTiger cache 4 GB, untuned: the default is half the node's RAM.
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "4"]
    volumes:
      - ${STATE_DIR}/mongo:/data/db

  # FiftyOne App. Datasets are ingested by pipeline jobs into the same Mongo;
  # media is read straight from the bucket directories, mounted at /buckets in
  # both this container and the job containers so filepaths match.
  fiftyone:
    <<: *common
    build: ./fiftyone
    image: flywheel-fiftyone:latest
    # --wait -1: keep serving after the last browser disconnects (a positive value exits after that many seconds).
    command: ["fiftyone", "app", "launch", "--remote", "--port", "5151", "--wait", "-1"]
    environment:
      HOME: /fiftyone
      FIFTYONE_DATABASE_URI: mongodb://mongo:27017
      FIFTYONE_DEFAULT_APP_ADDRESS: 0.0.0.0
      FIFTYONE_DO_NOT_TRACK: "true"
      VFF_MULTIMODAL: "1"   # plays LeRobot episode references and MCAP samples (sync-fiftyone-raw)
    volumes:
      - ${STATE_DIR}/fiftyone:/fiftyone
      - ${STATE_DIR}/versitygw/buckets:/buckets:ro
    depends_on: [mongo]

  # Rerun web viewer for bags in the raw bucket. No login of its own: Caddy fronts it with SSO on rerun.<host>.
  rerun:
    <<: *common
    build: ./rerun
    image: flywheel-rerun:0.38.1
    environment:
      HOME: /tmp

  # Triton runs on its own node (TRITON_NODE): triton/compose.yml, started by ctl.sh up; Caddy and Prometheus reach it there.

  # --- Single sign-on -------------------------------------------------------
  keycloak-db:
    <<: *common
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - ${STATE_DIR}/keycloak/db:/var/lib/postgresql/data
    healthcheck:   # same timing as Gitea's (~2 min); Keycloak waits for healthy. Untuned.
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 12

  keycloak:
    <<: *common
    image: quay.io/keycloak/keycloak:26.3
    user: "${SERVICE_UID}:0"   # our uid (reads the rendered realm file) with the image's group 0 (its install dir is group-writable, and `start` writes there)
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://${SERVICE_HOST}:${CADDY_PORT:-8443}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"   # containers reach it as http://keycloak:8080/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      HOME: /tmp   # kcadm.sh (used by ctl.sh user add) writes its config under $HOME
    volumes:
      - ${STATE_DIR}/keycloak/import:/opt/keycloak/data/import:ro   # realm.json rendered by ctl.sh
      - ./keycloak/themes/flywheel:/opt/keycloak/themes/flywheel:ro    # login theme: the default plus a tiled background
      - ${STATE_DIR}/keycloak/login-background:/opt/keycloak/themes/flywheel/login/resources/img:ro   # its image, kept out of git
    tmpfs:
      - /opt/keycloak/data/tmp:mode=1777   # Keycloak's gzip cache of theme files; cleared on restart so theme edits show
    depends_on:
      keycloak-db:
        condition: service_healthy

  oauth2-proxy:
    <<: *common
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.10.0
    command:
      - --provider=keycloak-oidc
      - --client-id=oauth2-proxy
      - --oidc-issuer-url=https://${SERVICE_HOST}:${CADDY_PORT:-8443}/auth/realms/flywheel
      - --provider-ca-file=/ca/root.crt
      - --redirect-url=https://${SERVICE_HOST}:${CADDY_PORT:-8443}/oauth2/callback
      - --cookie-domain=.${SERVICE_HOST}
      - --cookie-domain=${SERVICE_HOST}
      - --whitelist-domain=.${SERVICE_HOST}:${CADDY_PORT:-8443}
      - --whitelist-domain=${SERVICE_HOST}:${CADDY_PORT:-8443}
      - --cookie-secure=true
      - --cookie-name=_flywheel
      - --email-domain=*
      - --insecure-oidc-allow-unverified-email=true   # Keycloak sends no mail here, so an account made in the console stays unverified and its login 500s
      - --scope=openid profile email
      - --allowed-group=admins
      - --allowed-group=users
      - --set-xauthrequest=true
      - --reverse-proxy=true
      - --upstream=static://202       # auth only: 202 to a signed-in request; Caddy's (sso) snippet passes any 2xx
      - --http-address=0.0.0.0:4180
      - --skip-provider-button=true
      - --code-challenge-method=S256
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${KC_OAUTH2_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET}
    volumes:
      - ${STATE_DIR}/caddy/data/caddy/pki/authorities/local/root.crt:/ca/root.crt:ro
    depends_on: [keycloak]
