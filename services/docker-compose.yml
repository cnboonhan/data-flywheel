# Store stack: Caddy, Versity S3 Gateway, MLflow, Prometheus, Loki, Grafana.
# Every image is a multi-arch manifest (linux/arm64 + linux/amd64), so the same
# file runs on the GB300 node and on an Intel box. See README.md.

x-common: &common
  restart: unless-stopped
  user: "${SERVICE_UID}:${SERVICE_GID}"
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  caddy:
    <<: *common
    image: caddy:2.11
    ports:
      - "${CADDY_PORT:-8443}:8443"   # everything: path-routed on SERVICE_HOST, subdomains for fiftyone., rerun., s3.
    environment:
      SERVICE_HOST: ${SERVICE_HOST}
      CADDY_PORT: ${CADDY_PORT:-8443}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/site:/srv:ro
      - ${STATE_DIR}/caddy/data:/data
      - ${STATE_DIR}/caddy/config:/config
      - ${STATE_DIR}/versitygw/buckets/processed/rerun:/rerun:ro   # episode recordings served on rerun.<host>/data/
    depends_on: [mlflow, grafana, prometheus, loki, versitygw, gitea, keycloak, oauth2-proxy]

  versitygw:
    <<: *common
    image: versity/versitygw:v1.8.0
    command:
      - --port=:7070
      - --webui-s3-prefix=/ui         # web UI on the S3 port under /ui: https://s3.<host>:8443/ui/
      - --webui-gateways=https://s3.${SERVICE_HOST}:${CADDY_PORT:-8443}
      - --cors-allow-origin=https://${SERVICE_HOST}:${CADDY_PORT:-8443}
      - --iam-dir=/state/iam
      - --health=/health
      - posix
      - --sidecar=/state/meta        # /tier1 (WekaFS) has no xattrs; keep object metadata in a sidecar dir
      - --disable-copy-file-range
      - /state/buckets               # backend flags must precede the directory
    environment:
      ROOT_ACCESS_KEY_ID: ${ADMIN_USER}
      ROOT_SECRET_ACCESS_KEY: ${ADMIN_PASSWORD}
      VGW_REGION: ${S3_REGION:-us-east-1}
      VGW_LOG_LEVEL: ${S3_LOG_LEVEL:-silent}   # "debug" logs every request/response with secrets masked
    volumes:
      - ${STATE_DIR}/versitygw:/state

  mlflow:
    <<: *common
    build: ./mlflow
    image: flywheel-mlflow:3.17.0
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --app-name=basic-auth
      - --static-prefix=/mlflow
      - --allowed-hosts=${SERVICE_HOST},${SERVICE_HOST}:${CADDY_PORT:-8443}
      - --cors-allowed-origins=https://${SERVICE_HOST}:${CADDY_PORT:-8443}
      - --backend-store-uri=sqlite:////state/mlflow.db
      - --artifacts-destination=s3://mlflow   # checkpoints and run artifacts live in the S3 gateway
      - --serve-artifacts                     # clients upload through the server; no S3 creds needed
    environment:
      HOME: /state
      MLFLOW_AUTH_CONFIG_PATH: /etc/mlflow/basic_auth.ini
      MLFLOW_AUTH_ADMIN_USERNAME: ${ADMIN_USER}
      MLFLOW_AUTH_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_SECRET_KEY}   # signs CSRF tokens
      MLFLOW_S3_ENDPOINT_URL: http://versitygw:7070
      AWS_ACCESS_KEY_ID: ${ADMIN_USER}
      AWS_SECRET_ACCESS_KEY: ${ADMIN_PASSWORD}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - ./mlflow/basic_auth.ini:/etc/mlflow/basic_auth.ini:ro
      - ${STATE_DIR}/mlflow:/state

  prometheus:
    <<: *common
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-30d}
      - --web.route-prefix=/prometheus
      - --web.external-url=https://${SERVICE_HOST}:${CADDY_PORT:-8443}/prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${STATE_DIR}/prometheus:/prometheus

  loki:
    <<: *common
    image: grafana/loki:3.7.8
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - ${STATE_DIR}/loki:/loki

  grafana:
    <<: *common
    image: grafana/grafana:13.2.3
    environment:
      GF_SERVER_ROOT_URL: https://${SERVICE_HOST}:${CADDY_PORT:-8443}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Keycloak login (the local admin stays as a fallback).
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${KC_GRAFANA_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://${SERVICE_HOST}:${CADDY_PORT:-8443}/auth/realms/flywheel/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/auth/realms/flywheel/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/auth/realms/flywheel/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'admins') && 'Admin' || 'Editor'"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ${STATE_DIR}/grafana:/var/lib/grafana
    depends_on: [prometheus, loki]

  gitea:
    <<: *common
    image: gitea/gitea:1.25-rootless
    environment:
      USER: git   # our uid has no passwd entry; Gitea checks the name against RUN_USER (git)
      GITEA__server__ROOT_URL: https://${SERVICE_HOST}:${CADDY_PORT:-8443}/gitea/
      GITEA__server__DOMAIN: ${SERVICE_HOST}
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__USE_SUB_URL_PATH: "true"   # serve under /gitea/ itself; Caddy strips nothing
      GITEA__server__LOCAL_ROOT_URL: http://localhost:3000/gitea/   # what git hooks call back; must carry the sub-path too
      GITEA__server__DISABLE_SSH: "true"      # clone/push over HTTPS
      GITEA__server__OFFLINE_MODE: "true"
      GITEA__server__LFS_START_SERVER: "true"
      GITEA__security__INSTALL_LOCK: "true"   # skip the web installer; everything is configured here
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /var/lib/gitea/data/gitea.db
      GITEA__actions__ENABLED: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__repository__ENABLE_PUSH_CREATE_USER: "true"
      GITEA__webhook__ALLOWED_HOST_LIST: private,loopback
      GITEA__metrics__ENABLED: "true"
      GITEA__log__MODE: console
      GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
      GITEA__oauth2_client__ENABLE_AUTO_REGISTRATION: "true"
      GITEA__oauth2_client__USERNAME: nickname
      GITEA__oauth2_client__ACCOUNT_LINKING: auto
      GITEA__oauth2_client__UPDATE_AVATAR: "false"
      SSL_CERT_FILE: /ca/root.crt   # Caddy's CA, so OIDC discovery over https works
    volumes:
      - ${STATE_DIR}/gitea/data:/var/lib/gitea
      - ${STATE_DIR}/gitea/config:/etc/gitea
      - ${STATE_DIR}/caddy/data/caddy/pki/authorities/local/root.crt:/ca/root.crt:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/gitea/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Runs Gitea Actions jobs as sibling containers via the node's Docker socket.
  # ctl.sh registers it: it generates the token with `gitea actions
  # generate-runner-token` and writes it to ${STATE_DIR}/act_runner/token.
  act_runner:
    <<: *common
    image: gitea/act_runner:0.2.13
    group_add:
      - "${DOCKER_GID:-983}"   # gid of /var/run/docker.sock on the node
    environment:
      HOME: /data
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: http://gitea:3000/gitea/
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /data/token
      GITEA_RUNNER_NAME: ${SERVICE_NODE}
      RERUN_BASE: https://rerun.${SERVICE_HOST}:${CADDY_PORT:-8443}
    volumes:
      - ./act_runner/config.yaml:/config.yaml:ro
      - ${STATE_DIR}/act_runner:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      gitea:
        condition: service_healthy

  mongo:
    <<: *common
    image: mongo:8
    command: ["mongod", "--bind_ip_all", "--wiredTigerCacheSizeGB", "4"]   # default cache is half the node's RAM
    volumes:
      - ${STATE_DIR}/mongo:/data/db

  # FiftyOne App. Datasets are ingested by pipeline jobs into the same Mongo;
  # media is read straight from the bucket directories, mounted at /buckets in
  # both this container and the job containers so filepaths match.
  fiftyone:
    <<: *common
    image: voxel51/fiftyone:latest
    command: ["fiftyone", "app", "launch", "--remote", "--port", "5151", "--wait", "-1"]
    environment:
      HOME: /fiftyone
      FIFTYONE_DATABASE_URI: mongodb://mongo:27017
      FIFTYONE_DEFAULT_APP_ADDRESS: 0.0.0.0
      FIFTYONE_DO_NOT_TRACK: "true"
    volumes:
      - ${STATE_DIR}/fiftyone:/fiftyone
      - ${STATE_DIR}/versitygw/buckets:/buckets:ro
    depends_on: [mongo]

  # Rerun web viewer for episode recordings (processed/rerun/<dataset>/<episode>.rrd,
  # built by fiftyone/episode_rrd.py). No login of its own: Caddy fronts it with SSO on rerun.<host>.
  rerun:
    <<: *common
    build: ./rerun
    image: flywheel-rerun:0.38.1
    environment:
      HOME: /tmp

  # --- Single sign-on -------------------------------------------------------
  keycloak-db:
    <<: *common
    image: postgres:17
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - ${STATE_DIR}/keycloak/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 12

  keycloak:
    <<: *common
    image: quay.io/keycloak/keycloak:26.3
    user: "${SERVICE_UID}:0"   # our uid (reads the rendered realm file) with the image's group 0 (its install dir is group-writable, and `start` writes there)
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://${SERVICE_HOST}:${CADDY_PORT:-8443}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"   # containers reach it as http://keycloak:8080/auth
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      HOME: /tmp   # kcadm.sh (used by ctl.sh user add) writes its config under $HOME
    volumes:
      - ${STATE_DIR}/keycloak/import:/opt/keycloak/data/import:ro   # realm.json rendered by ctl.sh
    depends_on:
      keycloak-db:
        condition: service_healthy

  oauth2-proxy:
    <<: *common
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.10.0
    command:
      - --provider=keycloak-oidc
      - --client-id=oauth2-proxy
      - --oidc-issuer-url=https://${SERVICE_HOST}:${CADDY_PORT:-8443}/auth/realms/flywheel
      - --provider-ca-file=/ca/root.crt
      - --redirect-url=https://${SERVICE_HOST}:${CADDY_PORT:-8443}/oauth2/callback
      - --cookie-domain=.${SERVICE_HOST}
      - --cookie-domain=${SERVICE_HOST}
      - --whitelist-domain=.${SERVICE_HOST}:${CADDY_PORT:-8443}
      - --whitelist-domain=${SERVICE_HOST}:${CADDY_PORT:-8443}
      - --cookie-secure=true
      - --cookie-name=_flywheel
      - --email-domain=*
      - --scope=openid profile email
      - --allowed-group=admins
      - --allowed-group=users
      - --set-xauthrequest=true
      - --reverse-proxy=true
      - --upstream=static://202
      - --http-address=0.0.0.0:4180
      - --skip-provider-button=true
      - --code-challenge-method=S256
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${KC_OAUTH2_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_COOKIE_SECRET}
    volumes:
      - ${STATE_DIR}/caddy/data/caddy/pki/authorities/local/root.crt:/ca/root.crt:ro
    depends_on: [keycloak]
