# Build the environments the pipelines run in: the RoboDojo evaluation env (Isaac Sim 5.1, Isaac Lab, curobo,
# XPolicyLab, plus the sim assets and the RoboDojo data into raw/open_datasets/) and the ACT and DP policy envs.
# The job only logs in to the service node over ssh: the key (secret SETUP_SSH_KEY, set by ctl.sh up) may run
# tools/bin/setup-envs and nothing else, which runs the installers there as the service account, so the envs work on
# the GB300 nodes as built and nothing in the job's container touches the host. Dispatched by `services/ctl.sh up`
# when an env is missing or was built for another checkout, and by `services/ctl.sh setup`. Each installer is
# idempotent, so a re-run resumes.
name: setup-envs
concurrency:
  group: setup-envs
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only check the installers and the settings on the node (true/false)"
        default: "false"

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 1440   # the RoboDojo data can take up to a day on a cold start (gitea/setup/README.md); untuned
    env:
      SSH_KEY: ${{ secrets.SETUP_SSH_KEY }}
      SSH_HOST: ${{ vars.SERVICE_SSH_HOST }}          # the service node (ctl.sh up)
      KNOWN_HOSTS: ${{ vars.SERVICE_KNOWN_HOSTS }}    # its host keys (ctl.sh up)
      SSH_USER: ${{ vars.SERVICE_SSH_USER }}
    steps:
      - shell: bash
        run: |
          umask 077; key=$(mktemp); hosts=$(mktemp)
          printf '%s\n' "$SSH_KEY" > "$key"; printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          # The key's forced command is tools/bin/setup-envs, whatever is asked for here; it reads only `--dry-run`.
          ssh -i "$key" -o IdentitiesOnly=yes -o UserKnownHostsFile="$hosts" -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 "$SSH_USER@$SSH_HOST" setup-envs $([[ "${{ inputs.dry_run }}" == true ]] && echo --dry-run)
