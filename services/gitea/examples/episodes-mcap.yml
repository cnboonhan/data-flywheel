# ROS 2 mcap bags (h2rc) → canonical episodes in processed/episodes/<dataset>/.
name: episodes-mcap
on:
  workflow_dispatch:
    inputs:
      dataset:
        default: "h2rc"
      path:
        description: "Glob of episode directories under the raw bucket"
        default: "h2rc/launch_demo/*/*/*"
      limit:
        description: "Episodes (0 = all)"
        default: "0"

jobs:
  convert:
    runs-on: python
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
    steps:
      - name: checkout
        env:
          URL: ${{ github.api_url }}/repos/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
          TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF'
          import io, os, tarfile, urllib.request
          req = urllib.request.Request(os.environ["URL"], headers={"Authorization": "token " + os.environ["TOKEN"]})
          with tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen(req).read())) as tar:
              top = tar.getnames()[0].split("/")[0]
              for m in tar.getmembers():
                  m.name = m.name[len(top) + 1:]
                  if m.name:
                      tar.extract(m, ".")
          EOF
      - run: pip -q install mcap mcap-ros2-support imageio-ffmpeg boto3 pyyaml pyarrow
      - run: python fiftyone/episodes_from_mcap.py --dataset "${{ inputs.dataset }}" --path "${{ inputs.path }}" --limit "${{ inputs.limit }}"
