# Ingest LeRobot datasets (v2 or v3) from a bucket into FiftyOne, using
# fiftyone/ingest_lerobot.py from this repo. Lives at
# .gitea/workflows/ingest-lerobot.yml in the `pipelines` repo.
name: ingest-lerobot
on:
  workflow_dispatch:
    inputs:
      name:
        description: "FiftyOne dataset name"
        default: "HiFi-UMI-2K"
      path:
        description: "Glob under the bucket matching LeRobot roots (dirs with meta/info.json)"
        default: "HiFi-UMI-2K/chunk-0000/part-*"
      bucket:
        description: "Bucket the path is in"
        default: "raw"

jobs:
  ingest:
    runs-on: python
    container: voxel51/fiftyone:latest   # fiftyone + ffmpeg; /buckets is mounted by the runner
    env:
      FIFTYONE_DATABASE_URI: mongodb://mongo:27017
      FIFTYONE_DO_NOT_TRACK: "true"
    steps:
      # actions/checkout needs node, which this image lacks; fetch the repo
      # archive with the stdlib instead.
      - name: checkout
        env:
          URL: ${{ github.api_url }}/repos/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
          TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF'
          import io, os, tarfile, urllib.request
          req = urllib.request.Request(os.environ["URL"], headers={"Authorization": "token " + os.environ["TOKEN"]})
          with tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen(req).read())) as tar:
              top = tar.getnames()[0].split("/")[0]
              for m in tar.getmembers():
                  m.name = m.name[len(top) + 1:]
                  if m.name:
                      tar.extract(m, ".")
          EOF
      - run: pip -q install pyarrow pandas
      - run: python fiftyone/ingest_lerobot.py --name "${{ inputs.name }}" --root "/buckets/${{ inputs.bucket }}" --path "${{ inputs.path }}"
