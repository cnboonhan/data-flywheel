# Train an XPolicyLab policy as a Slurm GPU job, from Gitea Actions.
# The job itself is slurm/train-xpolicylab.sbatch in this repo at the commit
# being run; this workflow only submits it over SSH (restricted key, see
# services/slurm/slurm-submit) and streams the Slurm log until it ends.
name: train-xpolicylab
on:
  workflow_dispatch:
    inputs:
      policy:
        description: "XPolicyLab policy (ACT, DP)"
        default: "ACT"
      bench:
        default: "Galaxea"
      task:
        default: "Make_The_Bed_20250730_012"
      env_cfg:
        default: "arx_x5"
      action:
        default: "joint"
      seed:
        default: "0"
      extra:
        description: "Extra training args, e.g. --num_epochs 100 (ACT) or training.num_epochs=10 (DP)"
        default: ""

jobs:
  slurm:
    runs-on: ubuntu-latest
    steps:
      # Fetch the repo archive with the stdlib (actions/checkout needs a reachable
      # clone URL; the runner's internal one isn't on the job's trust path).
      - name: checkout
        env:
          URL: ${{ github.api_url }}/repos/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
          TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import io, os, tarfile, urllib.request
          req = urllib.request.Request(os.environ["URL"], headers={"Authorization": "token " + os.environ["TOKEN"]})
          with tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen(req).read())) as tar:
              top = tar.getnames()[0].split("/")[0]
              for m in tar.getmembers():
                  m.name = m.name[len(top) + 1:]
                  if m.name:
                      tar.extract(m, ".")
          EOF
      - name: submit and follow
        env:
          SSH_KEY: ${{ secrets.SLURM_SSH_KEY }}
          SSH_HOST: ${{ secrets.SLURM_SSH_HOST }}
          ARGS: ${{ inputs.policy }} ${{ inputs.bench }} ${{ inputs.task }} ${{ inputs.env_cfg }} ${{ inputs.action }} ${{ inputs.seed }} ${{ inputs.extra }}
        run: bash slurm/follow.sh train-xpolicylab.sbatch $ARGS
