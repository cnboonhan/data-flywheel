# Ingest HiFi-UMI-2K (LeRobot v3 layout) into FiftyOne.
#
# Each part is one mp4 per camera holding ~1 100 episodes as time ranges, so
# a FiftyOne sample is one mp4 (fields: chunk, part, camera) and each episode
# is a TemporalDetection on it (label = task, support = frame range). The
# saved view "episodes" (to_clips) shows one clip per episode per camera.
# Idempotent: parts already in the dataset are skipped.
name: ingest-hifi-umi
on:
  workflow_dispatch:
    inputs:
      chunks:
        description: "Glob of chunks to ingest, relative to raw/HiFi-UMI-2K (e.g. chunk-000* or * for all)"
        default: "chunk-0000"

jobs:
  ingest:
    runs-on: python
    container: voxel51/fiftyone:latest   # fiftyone + ffmpeg; /buckets is mounted by the runner
    env:
      FIFTYONE_DATABASE_URI: mongodb://mongo:27017
      FIFTYONE_DO_NOT_TRACK: "true"
      CHUNKS: ${{ inputs.chunks }}
    steps:
      - run: pip -q install pyarrow pandas
      - run: |
          python - <<'EOF'
          import glob, json, os
          import pandas as pd
          import fiftyone as fo

          ROOT = "/buckets/raw/HiFi-UMI-2K"
          NAME = "HiFi-UMI-2K"
          ds = fo.load_dataset(NAME) if fo.dataset_exists(NAME) else fo.Dataset(NAME, persistent=True)
          have = set(ds.values("filepath"))

          parts = sorted(glob.glob(f"{ROOT}/{os.environ.get('CHUNKS') or '*'}/part-*"))
          print(f"{len(parts)} parts, {len(have)} videos already ingested")
          for part in parts:
              info = json.load(open(f"{part}/meta/info.json"))
              fps = info["fps"]
              cams = [k for k, v in info["features"].items() if v.get("dtype") == "video"]
              tasks = pd.read_parquet(f"{part}/meta/tasks.parquet")
              task_of = {int(i): t for t, i in tasks["task_index"].items()}
              eps = pd.concat(pd.read_parquet(f) for f in sorted(glob.glob(f"{part}/meta/episodes/*/*.parquet")))
              chunk, pname = part.split("/")[-2:]
              samples = []
              for cam in cams:
                  ci, fi = f"videos/{cam}/chunk_index", f"videos/{cam}/file_index"
                  for (c, f), g in eps.groupby([ci, fi]):
                      path = f"{part}/" + info["video_path"].format(video_key=cam, chunk_index=int(c), file_index=int(f))
                      if path in have or not os.path.exists(path):
                          continue
                      dets = [
                          fo.TemporalDetection(
                              label=task_of.get(int(e["tasks"][0]) if str(e["tasks"][0]).isdigit() else -1, str(e["tasks"][0])),
                              support=[int(round(e[f"videos/{cam}/from_timestamp"] * fps)) + 1,
                                       max(int(round(e[f"videos/{cam}/to_timestamp"] * fps)), int(round(e[f"videos/{cam}/from_timestamp"] * fps)) + 1)],
                              episode_index=int(e["episode_index"]),
                              length=int(e["length"]),
                          )
                          for _, e in g.iterrows()
                      ]
                      samples.append(fo.Sample(filepath=path, chunk=chunk, part=pname, camera=cam.split(".")[-1],
                                               episodes=fo.TemporalDetections(detections=dets)))
              if samples:
                  ds.add_samples(samples)
                  print(f"{chunk}/{pname}: added {len(samples)} videos, {len(eps)} episodes each")

          ds.compute_metadata()
          if "episodes" not in ds.list_saved_views():
              ds.save_view("episodes", ds.to_clips("episodes"))
          print(ds)
          EOF
