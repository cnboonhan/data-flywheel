# Canonical episodes → Rerun recordings (processed/rerun/) and a grouped
# FiftyOne dataset "episodes/<dataset>" with one group per episode and a slice
# per camera. Run after episodes-lerobot / episodes-mcap.
name: ingest-episodes
# Gitea cancels an in-progress run of the same workflow and ref when a new one
# starts; keying the group by dataset lets different datasets run in parallel.
concurrency:
  group: ingest-episodes-${{ inputs.dataset }}
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Name under processed/episodes/"
        default: "galaxea-open-world-r1lite"

jobs:
  rerun:
    runs-on: python
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
    steps:
      - name: checkout
        env:
          URL: ${{ github.api_url }}/repos/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
          TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF'
          import io, os, tarfile, urllib.request
          req = urllib.request.Request(os.environ["URL"], headers={"Authorization": "token " + os.environ["TOKEN"]})
          with tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen(req).read())) as tar:
              top = tar.getnames()[0].split("/")[0]
              for m in tar.getmembers():
                  m.name = m.name[len(top) + 1:]
                  if m.name:
                      tar.extract(m, ".")
          EOF
      - run: pip -q install rerun-sdk==0.38.1 pyarrow boto3 && rerun analytics disable
      - run: python fiftyone/episode_rrd.py --path "${{ inputs.dataset }}/**/episode.json"

  fiftyone:
    needs: rerun
    runs-on: python
    container: voxel51/fiftyone:latest
    env:
      FIFTYONE_DATABASE_URI: mongodb://mongo:27017
      FIFTYONE_DO_NOT_TRACK: "true"
    steps:
      - name: checkout
        env:
          URL: ${{ github.api_url }}/repos/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
          TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF'
          import io, os, tarfile, urllib.request
          req = urllib.request.Request(os.environ["URL"], headers={"Authorization": "token " + os.environ["TOKEN"]})
          with tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen(req).read())) as tar:
              top = tar.getnames()[0].split("/")[0]
              for m in tar.getmembers():
                  m.name = m.name[len(top) + 1:]
                  if m.name:
                      tar.extract(m, ".")
          EOF
      - run: pip -q install pyarrow
      - run: python fiftyone/ingest_episodes.py --dataset "${{ inputs.dataset }}"
