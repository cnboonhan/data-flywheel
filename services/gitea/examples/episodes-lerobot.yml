# LeRobot (v2/v3) → canonical episodes in processed/episodes/<dataset>/.
name: episodes-lerobot
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Name under processed/episodes/"
        default: "galaxea-open-world-r1lite"
      path:
        description: "Glob under the bucket matching LeRobot roots"
        default: "galaxea-open-world-r1lite/*"
      bucket:
        default: "processed"
      limit:
        description: "Episodes per root (0 = all)"
        default: "0"

jobs:
  convert:
    runs-on: python
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
    steps:
      - name: checkout
        env:
          URL: ${{ github.api_url }}/repos/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
          TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF'
          import io, os, tarfile, urllib.request
          req = urllib.request.Request(os.environ["URL"], headers={"Authorization": "token " + os.environ["TOKEN"]})
          with tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen(req).read())) as tar:
              top = tar.getnames()[0].split("/")[0]
              for m in tar.getmembers():
                  m.name = m.name[len(top) + 1:]
                  if m.name:
                      tar.extract(m, ".")
          EOF
      - run: pip -q install pyarrow pandas boto3 imageio-ffmpeg
      - run: python fiftyone/episodes_from_lerobot.py --dataset "${{ inputs.dataset }}" --root "/buckets/${{ inputs.bucket }}" --path "${{ inputs.path }}" --limit "${{ inputs.limit }}"
