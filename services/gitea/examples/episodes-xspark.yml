# xspark HDF5 episodes (RoboDojo sim data in raw) → canonical episodes, and a
# server-side copy into the XPolicyLab training tree.
name: episodes-xspark
on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Name under processed/episodes/"
        default: "robodojo"
      path:
        description: "Glob under raw of directories holding episode_*.hdf5"
        default: "robodojo/stack_bowls/arx_x5/data"
      task:
        description: "XPolicyLab task name for the training copy (empty = skip)"
        default: "stack_bowls"
      limit:
        default: "0"

jobs:
  convert:
    runs-on: python
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
    steps:
      - name: checkout
        env:
          URL: ${{ github.api_url }}/repos/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
          TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF'
          import io, os, tarfile, urllib.request
          req = urllib.request.Request(os.environ["URL"], headers={"Authorization": "token " + os.environ["TOKEN"]})
          with tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen(req).read())) as tar:
              top = tar.getnames()[0].split("/")[0]
              for m in tar.getmembers():
                  m.name = m.name[len(top) + 1:]
                  if m.name:
                      tar.extract(m, ".")
          EOF
      - run: pip -q install h5py numpy imageio-ffmpeg boto3 pyarrow
      - run: python fiftyone/episodes_from_xspark.py --dataset "${{ inputs.dataset }}" --path "${{ inputs.path }}" --limit "${{ inputs.limit }}"
      - if: ${{ inputs.task != '' }}
        run: python xpolicylab/promote_xspark.py --src "${{ inputs.path }}" --bench RoboDojo --task "${{ inputs.task }}" --env-cfg arx_x5 --limit "${{ inputs.limit }}"
