# Evaluate a checkpoint in the RoboDojo simulator as a Slurm GPU job and record
# success rate / score in MLflow (slurm/evaluate-xpolicylab.sbatch).
name: evaluate-xpolicylab
on:
  workflow_dispatch:
    inputs:
      policy:
        default: "ACT"
      task:
        description: "RoboDojo task, e.g. stack_bowls"
        default: "stack_bowls"
      ckpt:
        description: "ckpt_name the checkpoint was trained under (XPolicyLab: policy/<P>/checkpoints/RoboDojo-<ckpt>-<env_cfg>-<action>-<seed>)"
        default: "stack_bowls"
      env_cfg:
        default: "arx_x5"
      action:
        default: "joint"
      seed:
        default: "0"
      eval_num:
        description: "Episodes to run (empty = the task's default, 25-50)"
        default: "5"

jobs:
  slurm:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        env:
          URL: ${{ github.api_url }}/repos/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
          TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import io, os, tarfile, urllib.request
          req = urllib.request.Request(os.environ["URL"], headers={"Authorization": "token " + os.environ["TOKEN"]})
          with tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen(req).read())) as tar:
              top = tar.getnames()[0].split("/")[0]
              for m in tar.getmembers():
                  m.name = m.name[len(top) + 1:]
                  if m.name:
                      tar.extract(m, ".")
          EOF
      - name: submit and follow
        env:
          SSH_KEY: ${{ secrets.SLURM_SSH_KEY }}
          SSH_HOST: ${{ secrets.SLURM_SSH_HOST }}
        run: bash slurm/follow.sh evaluate-xpolicylab.sbatch "${{ inputs.policy }}" "${{ inputs.task }}" "${{ inputs.ckpt }}" "${{ inputs.env_cfg }}" "${{ inputs.action }}" "${{ inputs.seed }}" "${{ inputs.eval_num }}"
