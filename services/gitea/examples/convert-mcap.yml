# Convert ROS 2 mcap bags (h2rc) into per-camera mp4s in the processed bucket,
# then ingest them into FiftyOne. Uses fiftyone/convert_mcap.py and
# fiftyone/ingest_videos.py from this repo.
name: convert-mcap
on:
  workflow_dispatch:
    inputs:
      path:
        description: "Glob of episode directories under the raw bucket"
        default: "h2rc/launch_demo/*/*/*"
      limit:
        description: "Convert at most this many episodes (0 = all)"
        default: "0"
      name:
        description: "FiftyOne dataset to ingest into"
        default: "h2rc"

jobs:
  convert:
    runs-on: python
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
    steps:
      - name: checkout
        env:
          URL: ${{ github.api_url }}/repos/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
          TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF'
          import io, os, tarfile, urllib.request
          req = urllib.request.Request(os.environ["URL"], headers={"Authorization": "token " + os.environ["TOKEN"]})
          with tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen(req).read())) as tar:
              top = tar.getnames()[0].split("/")[0]
              for m in tar.getmembers():
                  m.name = m.name[len(top) + 1:]
                  if m.name:
                      tar.extract(m, ".")
          EOF
      - run: pip -q install mcap mcap-ros2-support imageio-ffmpeg boto3 pyyaml
      - run: python fiftyone/convert_mcap.py --path "${{ inputs.path }}" --limit "${{ inputs.limit }}"

  ingest:
    needs: convert
    runs-on: python
    container: voxel51/fiftyone:latest
    env:
      FIFTYONE_DATABASE_URI: mongodb://mongo:27017
      FIFTYONE_DO_NOT_TRACK: "true"
    steps:
      - name: checkout
        env:
          URL: ${{ github.api_url }}/repos/${{ github.repository }}/archive/${{ github.sha }}.tar.gz
          TOKEN: ${{ github.token }}
        run: |
          python - <<'EOF'
          import io, os, tarfile, urllib.request
          req = urllib.request.Request(os.environ["URL"], headers={"Authorization": "token " + os.environ["TOKEN"]})
          with tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen(req).read())) as tar:
              top = tar.getnames()[0].split("/")[0]
              for m in tar.getmembers():
                  m.name = m.name[len(top) + 1:]
                  if m.name:
                      tar.extract(m, ".")
          EOF
      - run: python fiftyone/ingest_videos.py --name "${{ inputs.name }}" --path "h2rc/**/*.mp4"
