global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: [localhost:9090]

  - job_name: caddy
    static_configs:
      - targets: [caddy:9100]

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: grafana
    metrics_path: /grafana/metrics
    static_configs:
      - targets: [grafana:3000]

  - job_name: gitea
    metrics_path: /gitea/metrics
    static_configs:
      - targets: [gitea:3000]
