# Serve the Gitea repo triton on Triton (services/triton/sync.py): a Triton model repository whose configs name their
# weights as MLflow registered versions; every model is copied into s3://triton/models/ with its weights' path and
# loaded (again when its files or version changed); a model no longer in the repo is unloaded. The outcome goes to s3://triton/sync/ (status.json,
# log/) and each model's Triton config. A push to the triton repo dispatches it (its webhook, ctl.sh bootstrap_specs),
# or run it by hand.
name: sync-triton
concurrency:
  group: sync-triton
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Models to reload even if unchanged (space-separated)"
        default: ""
      dry_run:
        description: "Only report what would change (true/false)"
        default: "false"

jobs:
  sync:
    runs-on: python
    container:
      image: flywheel-triton:26.08   # built by ctl.sh up from services/triton/Dockerfile, same as the server
      # Literal path: the runner doesn't evaluate ${{ }} in volumes. Must match the checkout and container.valid_volumes
      # in act_runner/config.yaml. The packagers read XPolicyLab's ACT code and models/mlp from it.
      volumes:
        - /home/htx_boonhan/workspaces/data-flywheel:/home/htx_boonhan/workspaces/data-flywheel:ro
    timeout-minutes: 60   # a sync that loads the 122B takes ~4 min (services/triton/README.md); untuned
    env:
      # the registry the configs name (ctl.sh up: DEPLOY_MLFLOW_* in services/.env, else the stack's MLflow)
      MLFLOW_TRACKING_URI: ${{ vars.DEPLOY_MLFLOW_JOB_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ vars.DEPLOY_MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DEPLOY_MLFLOW_TRACKING_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      TRITON_URL: ${{ vars.TRITON_URL }}               # TRITON_NODE's Triton (ctl.sh up)
      TRITON_KEY: ${{ secrets.TRITON_KEY }}
      TRITON_VLLM_GPU: ${{ vars.TRITON_VLLM_GPU }}
      FLYWHEEL_ROOT: ${{ vars.FLYWHEEL_ROOT }}
      GIT_PYTHON_REFRESH: quiet
      PYTHONDONTWRITEBYTECODE: "1"   # the job runs as root; don't leave root-owned __pycache__ in the checkout
    steps:
      - name: the model repository
        # the triton repo's main (the model repository), read with a read-only token, into ./triton
        env:
          URL: ${{ github.api_url }}/repos/${{ github.repository_owner }}/triton/archive/main.tar.gz
          TOKEN: ${{ secrets.SPEC_READ_TOKEN }}
        run: |
          python3 - <<'PY'
          import io, os, tarfile, urllib.request
          req = urllib.request.Request(os.environ["URL"], headers={"Authorization": "token " + os.environ["TOKEN"]})
          with tarfile.open(fileobj=io.BytesIO(urllib.request.urlopen(req).read())) as tar:
              for m in tar.getmembers():
                  m.name = "triton/" + m.name.split("/", 1)[-1]
                  if m.isfile() or m.isdir():
                      tar.extract(m, ".")
          PY
      - shell: bash
        run: |
          export TRITON_REPO=$PWD/triton
          args=()
          [[ "${{ inputs.dry_run }}" == true ]] && args+=(--dry-run)
          [[ -n "${{ inputs.force }}" ]] && args+=(--force ${{ inputs.force }})
          rc=0; python3 "$FLYWHEEL_ROOT/services/triton/sync.py" "${args[@]}" || rc=$?
          python3 "$FLYWHEEL_ROOT/services/triton/sync.py" --status
          exit $rc
