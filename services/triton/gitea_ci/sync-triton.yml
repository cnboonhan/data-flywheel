# Serve models on Triton (services/triton/sync.py) as this repo's triton/models.yaml says: every listed registered model
# version is packaged into s3://triton/models/ and loaded; a model no longer listed is unloaded. The outcome goes to
# s3://triton/sync/ (status.json, log/) and each model's Triton config. Runs when the spec is pushed, or on demand.
name: sync-triton
concurrency:
  group: sync-triton
  cancel-in-progress: false
on:
  push:
    branches: [main]
    paths: [triton/models.yaml]
  workflow_dispatch:
    inputs:
      force:
        description: "Registered models to repackage and reload even if unchanged (space-separated)"
        default: ""
      dry_run:
        description: "Only report what would change (true/false)"
        default: "false"

jobs:
  sync:
    runs-on: python
    container:
      image: flywheel-triton:26.08   # built by ctl.sh up from services/triton/Dockerfile, same as the server
      # Literal path: the runner doesn't evaluate ${{ }} in volumes. Must match the checkout and container.valid_volumes
      # in act_runner/config.yaml. The packagers read XPolicyLab's ACT code and models/mlp from it.
      volumes:
        - /home/htx_boonhan/workspaces/data-flywheel:/home/htx_boonhan/workspaces/data-flywheel:ro
    timeout-minutes: 60   # a sync that loads the 122B takes ~4 min (services/triton/README.md); untuned
    env:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_TRACKING_USERNAME: ${{ vars.MLFLOW_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_KEY }}
      TRITON_URL: ${{ vars.TRITON_URL }}               # TRITON_NODE's Triton (ctl.sh up)
      TRITON_KEY: ${{ secrets.TRITON_KEY }}
      TRITON_VLLM_GPU: ${{ vars.TRITON_VLLM_GPU }}
      FLYWHEEL_ROOT: ${{ vars.FLYWHEEL_ROOT }}
      GIT_PYTHON_REFRESH: quiet
      PYTHONDONTWRITEBYTECODE: "1"   # the job runs as root; don't leave root-owned __pycache__ in the checkout
    steps:
      - name: spec
        # this repo's triton/models.yaml at the commit that started the run
        env:
          URL: ${{ github.api_url }}/repos/${{ github.repository }}/raw/triton/models.yaml?ref=${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          python3 -c 'import os, urllib.request; open("models.yaml", "wb").write(urllib.request.urlopen(urllib.request.Request(os.environ["URL"], headers={"Authorization": "token " + os.environ["TOKEN"]})).read())'
      - shell: bash
        run: |
          export TRITON_SPEC=$PWD/models.yaml
          args=()
          [[ "${{ inputs.dry_run }}" == true ]] && args+=(--dry-run)
          [[ -n "${{ inputs.force }}" ]] && args+=(--force ${{ inputs.force }})
          rc=0; python3 "$FLYWHEEL_ROOT/services/triton/sync.py" "${args[@]}" || rc=$?
          python3 "$FLYWHEEL_ROOT/services/triton/sync.py" --status
          exit $rc
