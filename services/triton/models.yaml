# What Triton serves (services/triton/README.md). This file in data-flywheel is the seed: the live copy is models.yaml
# in the Gitea repo triton (with backends/), and a push of it runs sync-triton, which packages, loads and test-runs
# what changed and unloads what is no longer listed. The weights must be registered in MLflow first (training runs;
# download-models-hf, by an admin).
#
# Per model: name (the MLflow registered model, also the Triton model's name) and version (its MLflow model version),
# and optionally backend (a Python backend in services/triton/backends/, or vllm; default by the Hugging Face repo, see
# HF_BACKENDS in sync.py), gpu (pin it to one GPU, the index inside Triton, 0-2; by default an image model runs on all
# three, a vLLM model on TRITON_VLLM_GPU) and vllm (vLLM engine arguments over sync.py's VLLM_ENGINE).

models:
  - {name: Qwen-Image-Edit-2511, version: 1}
  - {name: Pi05.r1pro.picking_up_cup, version: 1}
