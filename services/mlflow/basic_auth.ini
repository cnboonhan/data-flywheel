# Config for MLflow's basic-auth app. The admin credentials come from the
# MLFLOW_AUTH_ADMIN_USERNAME / MLFLOW_AUTH_ADMIN_PASSWORD env vars (see .env);
# they're only used to create the admin user the first time the store is empty.
[mlflow]
default_permission = READ
database_uri = sqlite:////state/basic_auth.db
authorization_function = mlflow.server.auth:authenticate_request_basic_auth
grant_default_workspace_access = false
