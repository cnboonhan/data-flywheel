# act_runner config. Runs jobs as sibling containers through the node's Docker
# socket; they join the compose network so they reach the S3 gateway at
# http://versitygw:7070 without TLS or the public hostname.
log:
  level: info

runner:
  file: .runner
  capacity: 2           # jobs at once; untuned
  timeout: 12h          # dataset jobs are long; the Galaxea adapter stops here and a re-dispatch continues. Untuned
  fetch_interval: 2s    # how often it polls Gitea for jobs (act_runner's default)
  envs:
    S3_ENDPOINT_URL: http://versitygw:7070
    AWS_DEFAULT_REGION: us-east-1   # must match S3_REGION in .env
  labels:
    - "ubuntu-latest:docker://docker.gitea.com/runner-images:ubuntu-latest"
    - "python:docker://python:3.12-slim"

cache:
  enabled: true
  dir: /data/cache
  host: act_runner    # how job containers reach the cache server (compose service name)
  port: 0               # any free port

container:
  network: flywheel_default
  privileged: false
  workdir_parent: workspace
  force_pull: false
  # Bucket directories, read-only, at the same path the FiftyOne container
  # uses, so ingested filepaths resolve there. Must match STATE_DIR in .env;
  # a bind mount is ignored unless its source is listed in valid_volumes.
  # --cpuset-mems: the service node's CPU memory only (NUMA nodes 0, 1 here; `cat /sys/devices/system/node/node*/cpulist`):
  # on a GB300 node each GPU's memory is a NUMA node too, and a job's file cache (downloads, syncs) would fill the GPUs.
  options: -v /tier1/mistral/flywheel/versitygw/buckets:/buckets:ro --cpuset-mems=0,1
  valid_volumes:
    - /tier1/mistral/flywheel/versitygw/buckets
    # sync-triton mounts the checkout read-only, at its host path (repo variable FLYWHEEL_ROOT), for its packagers;
    # keep it in step with the checkout location. Nothing else of the host: work there goes through tools/bin (ssh).
    - /home/htx_boonhan/workspaces/data-flywheel
