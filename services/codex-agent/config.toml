# Codex for the agent container (services/codex-agent/README.md): the stack's self-hosted LLM through the LLM gateway
# (services/llm-gateway), as the quickstart's "Local LLM" section sets it up, in yolo mode: Codex never asks before
# running a command or editing a file, and runs without its own sandbox, because the container is the sandbox (it sees
# only the mounted folder). entrypoint.sh copies this to $CODEX_HOME at start; CODEX_MODEL and LLM_URL override the
# model and the gateway per run (`-c` flags), so this file holds the defaults.
model_provider = "selfhosted"
model = "kimi-k3"                    # the gateway's served model (services/dynamo/README.md)

approval_policy = "never"            # yolo: no confirmation before commands or edits
sandbox_mode = "danger-full-access"  # no Codex sandbox inside the container (Landlock/seccomp aren't available there)

[model_providers.selfhosted]
name = "selfhosted"
base_url = "https://llm.flywheel.10.80.81.30.sslip.io:8443/v1"   # LLM_URL, the stack's gateway (no token)
wire_api = "responses"
requires_openai_auth = false

[tui]
screen_reader_detection_done = true
