<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Flywheel Architecture</title>
<style>
  :root {
    --bg: #fbfaf8;
    --fg: #1f2328;
    --muted: #59636e;
    --box: #ffffff;
    --accent: #0f7b6c;
    --io: #a14f05;
    --io-bg: #fdf1e3;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #16181c;
      --fg: #e6e8eb;
      --muted: #9aa4af;
      --box: #1f2228;
      --accent: #4fd1b5;
      --io: #f5b25b;
      --io-bg: #2e2416;
    }
  }
  :root[data-theme="dark"] {
    --bg: #16181c;
    --fg: #e6e8eb;
    --muted: #9aa4af;
    --box: #1f2228;
    --accent: #4fd1b5;
    --io: #f5b25b;
    --io-bg: #2e2416;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1320px; margin: 0 auto; padding: 32px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 24px; }
  figure { margin: 0; overflow-x: auto; }
  svg { display: block; width: 100%; min-width: 760px; height: auto; color: var(--fg); }
  .box { fill: var(--box); stroke: currentColor; stroke-width: 1.25; }
  .planned { stroke-dasharray: 5 4; }
  .t { font-size: 13px; font-weight: 600; fill: currentColor; }
  .s { font-size: 11.5px; fill: var(--muted); }
  .p { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: var(--muted); }
  .h { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; fill: var(--muted); }
  .e { fill: none; stroke: currentColor; stroke-width: 1.25; }
  .lnk { font-size: 11px; fill: var(--accent); text-decoration: underline; }
  .lnk:hover { fill: var(--fg); }
  .el { font-size: 11px; fill: currentColor; }
  .loop { fill: none; stroke: currentColor; stroke-width: 2; }
  .looplabel { font-size: 12px; font-weight: 600; fill: currentColor; }
  figcaption { color: var(--muted); font-size: 14px; margin-top: 16px; }
  .lane { fill: none; stroke: var(--muted); stroke-opacity: .35; stroke-dasharray: 4 4; }
  .io { fill: var(--io-bg); stroke: var(--io); stroke-width: 1.25; }
  .iot { font-size: 12px; font-weight: 500; fill: var(--io); }
  ul.legend { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-wrap: wrap; gap: 8px 24px; color: var(--muted); font-size: 13px; }
  ul.legend span { display: inline-block; width: 28px; height: 0; vertical-align: middle; margin-right: 8px; border-top: 1.5px solid var(--fg); }
  ul.legend .dash { border-top-style: dashed; }
  ul.legend .acc { border-top: 2px solid var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Data Flywheel</h1>

  <figure>
    <svg viewBox="0 0 1570 582" role="img" aria-label="Data Flywheel pipeline, left to right: Build, Store (Raw), Processed, Train, Evaluate, with a feedback loop from Evaluate back to Build and Processed.">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
        </marker>
      </defs>

      <!-- Stages -->
      <text class="h" x="105" y="26" text-anchor="middle">Build</text>
      <rect class="lane" x="10" y="44" width="190" height="432" rx="10"/>
      <text class="h" x="445" y="26" text-anchor="middle">Store (Raw)</text>
      <rect class="lane" x="350" y="44" width="190" height="432" rx="10"/>
      <text class="h" x="785" y="26" text-anchor="middle">Processed</text>
      <rect class="lane" x="690" y="44" width="190" height="432" rx="10"/>
      <text class="h" x="1125" y="26" text-anchor="middle">Train</text>
      <rect class="lane" x="1030" y="44" width="190" height="432" rx="10"/>
      <text class="h" x="1465" y="26" text-anchor="middle">Evaluate</text>
      <rect class="lane" x="1370" y="44" width="190" height="432" rx="10"/>

      <!-- 1 Build -->
      <rect class="box" x="15" y="60" width="180" height="44" rx="8"/>
      <text class="t" x="105" y="79" text-anchor="middle">Egocentric UMI</text>
      <a href="https://github.com/Toyota/yubi-hw" target="_blank" rel="noopener"><text class="lnk" x="105" y="95" text-anchor="middle">Toyota/yubi-hw</text></a>

      <rect class="box" x="15" y="124" width="180" height="44" rx="8"/>
      <text class="t" x="105" y="143" text-anchor="middle">Robot Teleoperation</text>
      <a href="https://userguide-galaxea.github.io/Product_User_Guide/Guide/R1/Software_Guide/#r1-torso-pose-control-coming-soon" target="_blank" rel="noopener"><text class="lnk" x="105" y="159" text-anchor="middle">Galaxea R1 guide</text></a>

      <rect class="box" x="15" y="188" width="180" height="60" rx="8"/>
      <text class="t" x="105" y="206" text-anchor="middle">Public Datasets</text>
      <a href="https://huggingface.co/datasets/simple-world-lab/HiFi-UMI-2K" target="_blank" rel="noopener"><text class="lnk" x="105" y="222" text-anchor="middle">HiFi-UMI-2K</text></a>
      <a href="https://huggingface.co/datasets/OpenGalaxea/Galaxea-Open-World-Dataset" target="_blank" rel="noopener"><text class="lnk" x="105" y="238" text-anchor="middle">Galaxea Open-World</text></a>

      <rect class="box" x="15" y="268" width="180" height="60" rx="8"/>
      <text class="t" x="105" y="286" text-anchor="middle">Sim Scenes</text>
      <a href="https://developer.nvidia.com/isaac/lab-arena" target="_blank" rel="noopener"><text class="lnk" x="105" y="302" text-anchor="middle">Isaac Lab-Arena</text></a>
      <a href="https://docs.nvidia.com/nurec/" target="_blank" rel="noopener"><text class="lnk" x="105" y="318" text-anchor="middle">NuRec</text></a>

      <rect class="box" x="15" y="348" width="180" height="44" rx="8"/>
      <text class="t" x="105" y="374" text-anchor="middle">Physical Scenes</text>
      <!-- Sim Scenes ↔ Physical Scenes -->
      <path class="e" d="M197 290 H216 V370 H197" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
      <text class="el" x="221" y="334">Sync Specs</text>

      <rect class="box" x="15" y="412" width="180" height="44" rx="8"/>
      <text class="t" x="105" y="431" text-anchor="middle">Inference Compute</text>
      <a href="https://docs.nvidia.com/deeplearning/triton-inference-server/user-guide/docs/index.html" target="_blank" rel="noopener"><text class="lnk" x="105" y="447" text-anchor="middle">Triton Inference Server</text></a>

      <!-- 2 Store -->
      <rect class="box" x="355" y="60" width="180" height="44" rx="8"/>
      <text class="t" x="445" y="79" text-anchor="middle">Connectivity</text>
      <a href="https://www.wireguard.com/" target="_blank" rel="noopener"><text class="lnk" x="445" y="95" text-anchor="middle">WireGuard</text></a>

      <rect class="box" x="355" y="124" width="180" height="44" rx="8"/>
      <text class="t" x="445" y="143" text-anchor="middle">Data Storage</text>
      <a href="https://github.com/versity/versitygw" target="_blank" rel="noopener"><text class="lnk" x="445" y="159" text-anchor="middle">Versity S3 Gateway</text></a>

      <rect class="box" x="355" y="188" width="180" height="60" rx="8"/>
      <text class="t" x="445" y="206" text-anchor="middle">Logging</text>
      <a href="https://grafana.com/docs/grafana/latest/fundamentals/getting-started/first-dashboards/get-started-grafana-prometheus/" target="_blank" rel="noopener"><text class="lnk" x="445" y="222" text-anchor="middle">Prometheus</text></a>
      <a href="https://grafana.com/oss/loki/" target="_blank" rel="noopener"><text class="lnk" x="445" y="238" text-anchor="middle">Loki</text></a>

      <rect class="box" x="355" y="268" width="180" height="44" rx="8"/>
      <text class="t" x="445" y="287" text-anchor="middle">Model Registry</text>
      <a href="https://mlflow.org/" target="_blank" rel="noopener"><text class="lnk" x="445" y="303" text-anchor="middle">MLflow</text></a>

      <!-- Build → Store -->
      <path class="e" d="M200 244 H348" marker-end="url(#arrow)"/>
      <text class="el" x="275" y="237" text-anchor="middle">Upload and Sync</text>

      <!-- 3 Process -->
      <rect class="box" x="695" y="60" width="180" height="44" rx="8"/>
      <text class="t" x="785" y="79" text-anchor="middle">Data Cleaning</text>
      <a href="https://docs.gitea.com/usage/actions/quickstart/" target="_blank" rel="noopener"><text class="lnk" x="785" y="95" text-anchor="middle">Gitea Actions</text></a>

      <rect class="box" x="695" y="124" width="180" height="44" rx="8"/>
      <text class="t" x="785" y="143" text-anchor="middle">Data Validation</text>
      <a href="https://docs.gitea.com/usage/actions/quickstart/" target="_blank" rel="noopener"><text class="lnk" x="785" y="159" text-anchor="middle">Gitea Actions</text></a>

      <rect class="box" x="695" y="188" width="180" height="44" rx="8"/>
      <text class="t" x="785" y="207" text-anchor="middle">Data Mixing</text>
      <a href="https://docs.gitea.com/usage/actions/quickstart/" target="_blank" rel="noopener"><text class="lnk" x="785" y="223" text-anchor="middle">Gitea Actions</text></a>

      <!-- 4 Train -->
      <rect class="box" x="1035" y="60" width="180" height="60" rx="8"/>
      <text class="t" x="1125" y="77" text-anchor="middle">Model Training</text>
      <text class="t" x="1125" y="93" text-anchor="middle">and Pre-Evals</text>
      <a href="https://github.com/XPolicyLab/XPolicyLab" target="_blank" rel="noopener"><text class="lnk" x="1125" y="110" text-anchor="middle">XPolicyLab</text></a>

      <rect class="box" x="1035" y="140" width="180" height="60" rx="8"/>
      <text class="t" x="1125" y="157" text-anchor="middle">Inference / Model</text>
      <text class="t" x="1125" y="173" text-anchor="middle">Optimizations</text>
      <a href="https://unsloth.ai/" target="_blank" rel="noopener"><text class="lnk" x="1125" y="190" text-anchor="middle">Unsloth</text></a>

      <rect class="box" x="1035" y="220" width="180" height="44" rx="8"/>
      <text class="t" x="1125" y="246" text-anchor="middle">Distillation</text>

      <!-- 5 Evaluate -->
      <rect class="box" x="1375" y="60" width="180" height="60" rx="8"/>
      <text class="t" x="1465" y="78" text-anchor="middle">Sim Evals</text>
      <a href="https://robodojo-benchmark.com/leaderboard#robodojo" target="_blank" rel="noopener"><text class="lnk" x="1465" y="94" text-anchor="middle">RoboDojo</text></a>
      <a href="https://robotwin-platform.github.io/" target="_blank" rel="noopener"><text class="lnk" x="1465" y="110" text-anchor="middle">RoboTwin</text></a>

      <rect class="box" x="1375" y="140" width="180" height="44" rx="8"/>
      <text class="t" x="1465" y="166" text-anchor="middle">Physical Evals</text>
      <path class="e" d="M1440 184 C1436 222, 1494 222, 1490 186" marker-end="url(#arrow)"/>
      <text class="el" x="1465" y="232" text-anchor="middle">Reset Automation</text>

      <!-- Process ↔ Train: Data Mixing ⇄ Scalable Model Training -->
      <path class="e" d="M875 210 H955 V196 M1035 90 H955 V96"/>
      <path class="e" d="M905 146 A50 50 0 0 1 1005 146" marker-end="url(#arrow)"/>
      <path class="e" d="M1005 146 A50 50 0 0 1 905 146" marker-end="url(#arrow)"/>
      <text class="el" x="955" y="143" text-anchor="middle">Architecture</text>
      <text class="el" x="955" y="157" text-anchor="middle">Experiments</text>

      <!-- Train → Store: trained model deployed to the registry (gap where it passes the feedback branch) -->
      <path class="e" d="M1125 476 V498 H791 M779 498 H445 V314" marker-end="url(#arrow)"/>
      <text class="el" x="615" y="491" text-anchor="middle">Deploy</text>

      <!-- Store → Build: model deployed from the registry to inference compute -->
      <path class="e" d="M400 312 V434 H197" marker-end="url(#arrow)"/>
      <text class="el" x="275" y="427" text-anchor="middle">Deploy</text>

      <!-- Evaluate → Store: evaluation logs written back to storage (below the columns, gap where it passes the feedback branch) -->
      <path class="e" d="M1420 476 V524 H791 M779 524 H420 V478" marker-end="url(#arrow)"/>
      <text class="el" x="1275" y="517" text-anchor="middle">Eval Logs</text>

      <!-- Feedback loop: Evaluate → Build and Process -->
      <path class="loop" d="M1465 476 V550 H105 V478" marker-end="url(#arrow)"/>
      <path class="loop" d="M785 550 V478" marker-end="url(#arrow)"/>
      <text class="looplabel" x="785" y="570" text-anchor="middle">Feedback Loop</text>
    </svg>
  </figure>
</main>
</body>
</html>
