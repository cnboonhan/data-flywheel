# @package _global_
# G0Tiny fine-tuned for the grasp and lift at the counter in BEHAVIOR-1K: g0tiny_behavior.yaml with the data config
# without the chassis (r1pro_sim/eef_torso.yaml), so the pretrained G0Tiny loads strictly as the zero-shot baseline
# and each episode starts at the torso lean. Evaluated from the base pose the scripted policy parks at
# (adapter/eval_galaxea_behavior.py).

defaults:
  - override /data: r1pro_sim/eef_torso
  - override /model: vla/g0tiny

data:
  dataset:
    lerobot_ds_version: "2.1"   # behavior_to_lerobot.py writes v2.1 (LeRobot 0.3.3); the loader reads both
    dataset_dirs: null
