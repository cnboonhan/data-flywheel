# GalaxeaVLA data config for R1 Pro episodes recorded in BEHAVIOR-1K (sensors/autolearn/adapter/behavior_to_lerobot.py
# --format galaxea): upstream's r1pro/eef_torso.yaml plus the base, with these differences:
#   - action chassis.velocities (vx vy vz wx wy wz in the base frame; vz, wx, wy are 0): the robot drives to the object;
#   - cameras are 512 x 512 (ASPIRE's BEHAVIOR capture), not 360/480 x 640;
#   - ee_start_moving_thresh 0: upstream skips each episode's start until the hand moves, which would drop the drive;
#   - end-effector poses are in the base frame (x y z qx qy qz qw), grippers 0 closed .. 100 open, as upstream expects.
dataset:
  _target_: galaxea_fm.data.galaxea_lerobot_dataset.GalaxeaLerobotDataset

  dataset_dirs: null

  shape_meta:
    action:
      - key: left_ee_pose
        raw_shape: 7
        shape: 9
      - key: left_gripper
        raw_shape: 1
        shape: 1
      - key: right_ee_pose
        raw_shape: 7
        shape: 9
      - key: right_gripper
        raw_shape: 1
        shape: 1
      - key: torso
        raw_shape: 4
        shape: 4
      - key: chassis.velocities
        raw_shape: 6
        shape: 6

    state:
      - key: left_ee_pose
        raw_shape: 7
        shape: 9
      - key: left_gripper
        raw_shape: 1
        shape: 1
      - key: right_ee_pose
        raw_shape: 7
        shape: 9
      - key: right_gripper
        raw_shape: 1
        shape: 1
      - key: torso
        raw_shape: 4
        shape: 4
    
    images:
      - key: head_rgb
        raw_shape: 
          - 3
          - 512
          - 512
        shape:
          - 3
          - ${model.model_meta.input_image_size.0}
          - ${model.model_meta.input_image_size.1}
      - key: left_wrist_rgb
        raw_shape: 
          - 3
          - 512
          - 512
        shape: 
          - 3
          - ${model.model_meta.input_image_size.0}
          - ${model.model_meta.input_image_size.1}
      - key: right_wrist_rgb
        raw_shape:
          - 3
          - 512
          - 512
        shape: 
          - 3
          - ${model.model_meta.input_image_size.0}
          - ${model.model_meta.input_image_size.1}

  action_size: 32
  past_action_size: 0
  obs_size: 1
  ee_start_moving_thresh: 0.0
  val_set_proportion: 0.05


processor:
  _target_: galaxea_fm.processors.base_processor.BaseProcessor

  shape_meta: ${data.dataset.shape_meta}
  num_obs_steps: ${data.dataset.obs_size}
  num_output_cameras: 3
  action_output_dim: ${sum_shapes:${data.dataset.shape_meta.action}}
  proprio_output_dim: ${sum_shapes:${data.dataset.shape_meta.state}}

  action_state_transforms:
    - _target_: galaxea_fm.transforms.relative_action.RelativePoseTransform
      keys: [left_ee_pose, right_ee_pose]
    - _target_: galaxea_fm.transforms.relative_action.RelativeJointTransform
      keys: [torso]
    - _target_: galaxea_fm.transforms.rotation.PoseRotationTransform
      rotation_type: rotation_6d
      category_keys:
        action: [left_ee_pose, right_ee_pose]
        state: [left_ee_pose, right_ee_pose]

  # action & state normalization
  use_stepwise_action_norm: True
  norm_default_mode: ${model.model_meta.norm_default_mode}
  norm_exception_mode:
    action:
      left_gripper: "0/100"
      right_gripper: "0/100"
  
  action_state_merger: 
    _target_: galaxea_fm.transforms.action_state_merger.ConcatLeftAlign

  # image transform
  train_transforms:
    head_rgb:
      - _target_: torchvision.transforms.Resize
        size: ${model.model_meta.input_image_size}
      - _target_: galaxea_fm.transforms.image.ToTensor
      - _target_: torchvision.transforms.Normalize
        mean: [0.5, 0.5, 0.5]
        std: [0.5, 0.5, 0.5]
    left_wrist_rgb: ${data.processor.train_transforms.head_rgb}
    right_wrist_rgb: ${data.processor.train_transforms.head_rgb}

  val_transforms:
    head_rgb: 
      - _target_: torchvision.transforms.Resize
        size: ${model.model_meta.input_image_size}
      - _target_: galaxea_fm.transforms.image.ToTensor
      - _target_: torchvision.transforms.Normalize
        mean: [0.5, 0.5, 0.5]
        std: [0.5, 0.5, 0.5]
    left_wrist_rgb: ${data.processor.val_transforms.head_rgb}
    right_wrist_rgb: ${data.processor.val_transforms.head_rgb}

  # instruction
  drop_high_level_prob: 1.0
  use_zh_instruction: False

  tokenizer: ${model.tokenizer}
