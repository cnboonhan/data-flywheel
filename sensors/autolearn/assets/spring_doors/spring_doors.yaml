# Self-closing doors for BEHAVIOR-1K scenes (spring_doors.py): a door closer on each chosen hinge, so the robot has to
# hold the door open while it passes. Drawn per task instance (seeded by it): an instance always gets the same doors.

categories: [door]          # object categories to spring (OmniGibson's `category`); sliding_door and garage_door are structural
joint_types: [revolute]     # hinges only: a sliding door with a spring is not a common fitting
fraction: 1.0               # share of the matching doors that get a closer
objects: []                 # object names to restrict to (e.g. [door_tfdrhh_0]); empty: every matching door

# Closing torque K (q - closed) + K * time_constant * qdot. Measured on house_single_floor's doors (10-11 kg leaves),
# from 0.9 rad (half open): K 5, time constant 3.6 s closes in 2.5 s; K 10, 2.5 s in 1.8 s; K 20, 2.4 s in 1.75 s.
# A damping ratio of 1 (time constant 0.4-0.8 s) slams shut in 0.3-1.4 s; at K 2 and 8 s the door stalls short of
# closed. Holding the door at 90 degrees takes K * 1.57 N m: 8-24 N m over this range.
stiffness: [5.0, 15.0]      # N m / rad
time_constant: [3.0, 6.0]   # s: about 2-4 s to close from half open, a commercial closer's pace

# Lever handles (spring_doors.add_handle): a lever on each face, horizontal at rest and pointing towards the hinge,
# both on one spindle; pressing either down past unlatch_deg frees the closed door. Dimensions follow a common
# commercial lever set; the forces are untuned starting points.
handles:
  enabled: true
  height: 1.0               # m above the leaf's bottom edge: the usual lever height, used where the model has no handle
  handle_margin: 0.004      # m past the slab's face that counts as the model's own handle (flattened, lever goes there)
  backset: 0.065            # m from the free edge to the spindle where the model has no handle: a common backset
  lever_length: 0.13        # m, spindle to lever tip
  lever_thickness: 0.02     # m, the lever's square section
  standoff: 0.05            # m from each face to its lever, room for fingers
  mass: 0.25                # kg, both levers and the spindle (a common lever pair)
  max_deg: 45               # the lever's travel down from horizontal
  unlatch_deg: 30           # turn that frees the latch
  return_torque: 0.8        # N m back towards horizontal at max_deg (~6 N at the tip, a real lever's feel). At 2.0 the
                            # R1 Pro's gripper, pinching the bar, was forced open while pressing it (opening 0.22 ->
                            # 0.3-0.5) and only 3 of 8 presses passed the unlatch angle (the rest stalled at 15-21 deg)
  preload_deg: 15           # the spring aims this far above the horizontal stop, so the lever rests level: the 0.25 kg
                            # lever's weight (~0.1 N m) is under the 0.2 N m preload; at 1.0 N m with no preload a
                            # 0.4 kg lever sagged 6 degrees
  return_damping: 0.002     # N m s / deg on the lever's spring; untuned
  latch_band: 0.03          # rad from closed within which the latch catches; at 0.02 the closer's slow last
                            # approach (0.021 rad after 5.5 s) left the door just outside it
  latch_stiffness: 2000.0   # N m / rad holding a latched door: ~40 N m to move it the full band; untuned
  latch_damping: 200.0      # N m s / rad; untuned
